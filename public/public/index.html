<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Leviathan Web UI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🦑 Leviathan Web</h1>
    <p>Interfaccia per l’addon New-leviatano-</p>
  </header>

  <main>
    <section id="search-section">
      <h2>Ricerca</h2>
      <div class="search-bar">
        <input id="search-input" placeholder="Cerca film / serie / anime...">
        <button id="search-btn">Cerca</button>
      </div>
      <div id="search-results"></div>
    </section>

    <section id="meta-section">
      <h2>Dettagli (Meta)</h2>
      <div id="meta-content" class="box"></div>
    </section>

    <section id="stream-section">
      <h2>Stream</h2>
      <div id="stream-content" class="box"></div>
    </section>
  </main>

  <footer>
    <small>Leviathan UI – repo: New-leviatano-</small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
